# Include inside the TLS server block serving the app.
# Example: a managed SSH tunnel forwards loopback port 8788 to the info service.
    location ^~ /api/weather/ {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:8788;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_connect_timeout 3s;
        proxy_read_timeout 60s;
        proxy_send_timeout 15s;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
    }
    location ^~ /api/notams/ {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:8788;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_connect_timeout 3s;
        proxy_read_timeout 60s;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
    }
